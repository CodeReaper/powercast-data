name: Scheduled tasks
run-name: "Scheduled tasks — ${{ github.event.schedule }}"

on:
  schedule:
    # github scheduler is wildly unreliable - sorry
    - cron: "15 13 * * * *"
      timezone: "Europe/Copenhagen"

    - cron: "0 15 * * * *"
      timezone: "Europe/Copenhagen"

    - cron: "0 20 * * *"
      timezone: "Europe/Copenhagen"

    - cron: "0 21 * * 1"
      timezone: "Europe/Copenhagen"

permissions:
  contents: read

jobs:
  pull-data:
    if: github.event.schedule != '0 21 * * 1'
    uses: ./.github/workflows/pull-data.yaml
    secrets: inherit

  health-checks:
    if: github.event.schedule == '0 20 * * *'
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/health-checks.yaml

  pull-tariff-data:
    if: github.event.schedule == '0 21 * * 1'
    uses: ./.github/workflows/pull-tariff-data.yaml
    secrets: inherit

  upgrade-go:
    if: github.event.schedule == '0 21 * * 1'
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/upgrade-go.yaml
    secrets: inherit

  diagnostics:
    name: Schedule diagnostics
    runs-on: ubuntu-latest
    steps:
      - name: Record schedule and execution time
        shell: sh
        env:
          CRON: ${{ github.event.schedule }}
          TZ: Europe/Copenhagen
        run: |
          set -e
          {
            printf 'Cron: %s\n' "$CRON"
            printf 'Timezone: %s\n' "$TZ"
            date -u '+Observed UTC: %Y-%m-%dT%H:%M:%SZ'
            date '+Observed local: %Y-%m-%dT%H:%M:%S%:z'
            printf 'Run: %s; attempt: %s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Commit: %s\n' "$GITHUB_SHA"
          } | tee -a "$GITHUB_STEP_SUMMARY"
